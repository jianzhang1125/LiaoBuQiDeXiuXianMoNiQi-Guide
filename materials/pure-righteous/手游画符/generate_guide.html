<!DOCTYPE html>
<html>
<head>
    <title>画符辅助线生成器</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        canvas { border: 1px solid #ccc; margin: 20px 0; }
        button { margin: 10px 5px; padding: 10px 20px; }
        input { margin: 0 5px; padding: 5px; width: 80px; }
        .resolution-input { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>画符辅助线生成器</h1>
    <p>基于自动画符mod的实现原理，生成包含8x8网格辅助线和有效点位的图片。</p>
    
    <div class="resolution-input">
        <h3>分辨率设置</h3>
        <label>宽度: <input type="number" id="widthInput" value="1620" min="100" max="5000"></label>
        <label>高度: <input type="number" id="heightInput" value="2040" min="100" max="5000"></label>
        <button onclick="updateCanvasSize()">更新画布尺寸</button>
    </div>
    
    <h3>生成结果</h3>
    <canvas id="guideCanvas" width="1620" height="2040"></canvas>
    <br>
    <button onclick="generateGuide()">生成辅助线和点位</button>
    <button onclick="saveImage()">保存图片</button>
    
    <script>
        // 获取画布元素
        const canvas = document.getElementById('guideCanvas');
        
        // 更新画布尺寸
        function updateCanvasSize() {
            const width = parseInt(document.getElementById('widthInput').value);
            const height = parseInt(document.getElementById('heightInput').value);
            
            if (!isNaN(width) && !isNaN(height) && width > 0 && height > 0) {
                canvas.width = width;
                canvas.height = height;
                generateGuide();
                console.log(`画布尺寸已更新为 ${width}x${height}`);
            } else {
                alert('请输入有效的宽度和高度值');
            }
        }
        
        // 生成辅助线和点位
        function generateGuide() {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            // 清空画布
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, width, height);
            
            // 计算8x8网格的单元格大小
            const cellWidth = Math.floor(width / 8);
            const cellHeight = Math.floor(height / 8);
            
            // 绘制辅助线（网格线）
            ctx.strokeStyle = 'lightgray';
            ctx.lineWidth = 2;
            ctx.setLineDash([]);
            
            for (let i = 0; i <= 8; i++) {
                // 垂直线
                const x = i * cellWidth;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
                
                // 水平线
                const y = i * cellHeight;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            
            // 计算中心点偏移，使网格居中
            const offsetX = (width % 8) / 2;
            const offsetY = (height % 8) / 2;
            
            // 生成全部64个点位（每个格子一个），从左下角开始，从左到右，从下到上
            const validPoints = [];
            for (let row = 7; row >= 0; row--) {
                for (let col = 0; col < 8; col++) {
                    validPoints.push({ col, row });
                }
            }
            
            // 绘制有效点位（数字显示）和虚线X中心线
            ctx.font = Math.min(cellWidth, cellHeight) * 0.5 + 'px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            validPoints.forEach((point, index) => {
                const x = point.col * cellWidth + cellWidth / 2 + offsetX;
                const y = point.row * cellHeight + cellHeight / 2 + offsetY;
                const number = index + 1;
                
                // 绘制虚线X中心线
                ctx.strokeStyle = 'lightgray';
                ctx.setLineDash([5, 5]);
                ctx.lineWidth = 1;
                
                // 左上到右下
                ctx.beginPath();
                ctx.moveTo(point.col * cellWidth + offsetX, point.row * cellHeight + offsetY);
                ctx.lineTo((point.col + 1) * cellWidth + offsetX, (point.row + 1) * cellHeight + offsetY);
                ctx.stroke();
                
                // 右上到左下
                ctx.beginPath();
                ctx.moveTo((point.col + 1) * cellWidth + offsetX, point.row * cellHeight + offsetY);
                ctx.lineTo(point.col * cellWidth + offsetX, (point.row + 1) * cellHeight + offsetY);
                ctx.stroke();
                
                // 重置线条样式
                ctx.setLineDash([]);
                
                // 为1-60每6个点位标注为同一组
                let bgColor = '#FFFFFF';
                let textColor = 'red';
                if (number <= 60) {
                    const group = Math.floor((number - 1) / 6) + 1;
                    // 使用更加柔和且对比度高的颜色组合
                    const colorSchemes = [
                        { bg: '#E6F7FF', text: '#1890FF' }, // 蓝色系
                        { bg: '#F6FFED', text: '#52C41A' }, // 绿色系
                        { bg: '#FFF7E6', text: '#FA8C16' }, // 橙色系
                        { bg: '#FFF0F6', text: '#EB2F96' }, // 粉色系
                        { bg: '#F0F5FF', text: '#722ED1' }, // 紫色系
                        { bg: '#E8F5E8', text: '#2E7D32' }, // 深绿色系
                        { bg: '#FFF8E1', text: '#FF6F00' }, // 深橙色系
                        { bg: '#F3E5F5', text: '#673AB7' }, // 深紫色系
                        { bg: '#E0F2F1', text: '#00897B' }, // 青色系
                        { bg: '#FFEBEE', text: '#C62828' }  // 红色系
                    ];
                    const scheme = colorSchemes[(group - 1) % colorSchemes.length];
                    bgColor = scheme.bg;
                    textColor = scheme.text;
                    
                    // 绘制分组背景
                    ctx.fillStyle = bgColor;
                    ctx.beginPath();
                    ctx.arc(x, y, Math.min(cellWidth, cellHeight) * 0.4, 0, 2 * Math.PI);
                    ctx.fill();
                }
                
                // 绘制数字
                ctx.fillStyle = textColor;
                ctx.fillText(number.toString(), x, y);
            });
            
            console.log('辅助线和点位生成完成');
        }
        
        // 保存图片
        function saveImage() {
            const width = canvas.width;
            const height = canvas.height;
            const link = document.createElement('a');
            link.download = `painting_guide_${width}x${height}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // 页面加载时自动生成
        window.onload = function() {
            generateGuide();
        };
    </script>
</body>
</html>
