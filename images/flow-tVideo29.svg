<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="机缘偷天的长期岗位"><rect width="100%" height="100%" fill="#f6f2e8"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243b3b}.title{font-size:26px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:17px}</style><text x="30" y="42" class="title">机缘偷天的长期岗位</text><text x="30" y="80" class="small">由本页已有步骤整理；这是流程示意，不是游戏界面截图。</text><rect x="45" y="108" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="150" class="label">01　结丹前核对灵气技能与寿元储备</text><text x="380" y="200" text-anchor="middle" class="label">↓</text><rect x="45" y="208" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="250" class="label">02　元神常驻：历练取宝、获取资源</text><text x="380" y="300" text-anchor="middle" class="label">↓</text><rect x="45" y="308" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="350" class="label">03　有空回门派持续淬炼并恢复灵气</text><text x="380" y="400" text-anchor="middle" class="label">↓</text><rect x="45" y="408" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="450" class="label">04　再次渡劫前检查心脏旧伤与治疗</text></svg>