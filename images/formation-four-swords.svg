<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" role="img" aria-label="自制四剑阵 · 阵枢与四阵眼"><rect width="100%" height="100%" fill="#f6f2e8"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243b3b}.title{font-size:26px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:17px}</style><text x="30" y="42" class="title">自制四剑阵 · 阵枢与四阵眼</text><text x="30" y="78" class="small">六边格位置示意；接缝符字与旋转方向请对照下方原图。</text><polygon points="389.0,290.0 354.5,349.8 285.5,349.8 251.0,290.0 285.5,230.2 354.5,230.2" fill="#e6bd75" stroke="#506d70" stroke-width="3"/><text x="320" y="286" text-anchor="middle" class="label">阵枢</text><text x="320" y="313" text-anchor="middle" class="small">主攻者</text><polygon points="389.0,170.5 354.5,230.2 285.5,230.2 251.0,170.5 285.5,110.7 354.5,110.7" fill="#b7d6da" stroke="#506d70" stroke-width="3"/><text x="320" y="166.48849427774746" text-anchor="middle" class="label">阵眼①</text><text x="320" y="193.48849427774746" text-anchor="middle" class="small">正上</text><polygon points="492.5,230.2 458.0,290.0 389.0,290.0 354.5,230.2 389.0,170.5 458.0,170.5" fill="#b7d6da" stroke="#506d70" stroke-width="3"/><text x="423.5" y="226.24424713887373" text-anchor="middle" class="label">阵眼②</text><text x="423.5" y="253.24424713887373" text-anchor="middle" class="small">右上</text><polygon points="492.5,349.8 458.0,409.5 389.0,409.5 354.5,349.8 389.0,290.0 458.0,290.0" fill="#b7d6da" stroke="#506d70" stroke-width="3"/><text x="423.5" y="345.75575286112627" text-anchor="middle" class="label">阵眼③</text><text x="423.5" y="372.75575286112627" text-anchor="middle" class="small">右下</text><polygon points="389.0,409.5 354.5,469.3 285.5,469.3 251.0,409.5 285.5,349.8 354.5,349.8" fill="#b7d6da" stroke="#506d70" stroke-width="3"/><text x="320" y="405.51150572225254" text-anchor="middle" class="label">阵眼④</text><text x="320" y="432.51150572225254" text-anchor="middle" class="small">正下</text><text x="30" y="530" class="small">总人数始终为 5 人：1 阵枢＋4 阵眼。</text><text x="30" y="561" class="small">四剑字／七剑字说的是符字数量，不是人数。</text><text x="30" y="592" class="small">原图357：四剑归一；原图356：七剑字高输出。</text><text x="30" y="623" class="small">这里只标位置，不能替代编辑器里的符字接缝。</text></svg>