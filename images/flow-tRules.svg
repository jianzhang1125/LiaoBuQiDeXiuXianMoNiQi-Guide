<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="门规与外出事件"><rect width="100%" height="100%" fill="#f6f2e8"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243b3b}.title{font-size:26px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:17px}</style><text x="30" y="42" class="title">门规与外出事件</text><text x="30" y="80" class="small">由本页已有步骤整理；这是流程示意，不是游戏界面截图。</text><rect x="45" y="108" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="150" class="label">01　明确本次目标：机缘／资源／外交</text><text x="380" y="200" text-anchor="middle" class="label">↓</text><rect x="45" y="208" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="250" class="label">02　在门规中设置对应事件处理方式</text><text x="380" y="300" text-anchor="middle" class="label">↓</text><rect x="45" y="308" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="350" class="label">03　外交不确定的选择保留请示门派</text><text x="380" y="400" text-anchor="middle" class="label">↓</text><rect x="45" y="408" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="450" class="label">04　派出历练后核对实际事件与正道倾向</text></svg>