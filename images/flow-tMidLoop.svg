<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="中期循环：按资源与冷却推进"><rect width="100%" height="100%" fill="#f6f2e8"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243b3b}.title{font-size:26px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:17px}</style><text x="30" y="42" class="title">中期循环：按资源与冷却推进</text><text x="30" y="80" class="small">由本页已有步骤整理；这是流程示意，不是游戏界面截图。</text><rect x="45" y="108" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="150" class="label">01　先看岗位、守家与当前培养目标</text><text x="380" y="200" text-anchor="middle" class="label">↓</text><rect x="45" y="208" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="250" class="label">02　查丹药、符纸、幽珀等补给缺口</text><text x="380" y="300" text-anchor="middle" class="label">↓</text><rect x="45" y="308" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="350" class="label">03　按成熟日期采收，按冷却历练外交</text><text x="380" y="400" text-anchor="middle" class="label">↓</text><rect x="45" y="408" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="450" class="label">04　检查化形倒计时与伤势，再开始下一轮</text></svg>