<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="淬炼与工作符顺序"><rect width="100%" height="100%" fill="#f6f2e8"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243b3b}.title{font-size:26px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:17px}</style><text x="30" y="42" class="title">淬炼与工作符顺序</text><text x="30" y="80" class="small">由本页已有步骤整理；这是流程示意，不是游戏界面截图。</text><rect x="45" y="108" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="150" class="label">01　录入对应功法，学习幽淬／道淬</text><text x="380" y="200" text-anchor="middle" class="label">↓</text><rect x="45" y="208" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="250" class="label">02　核对技能条件、灵气与幽珀／劫灰</text><text x="380" y="300" text-anchor="middle" class="label">↓</text><rect x="45" y="308" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="350" class="label">03　符纸先淬到12阶，再画符</text><text x="380" y="400" text-anchor="middle" class="label">↓</text><rect x="45" y="408" width="670" height="68" rx="12" fill="#dae5dc"/><text x="65" y="450" class="label">04　按岗位穿工作符；聚灵处持续恢复</text></svg>